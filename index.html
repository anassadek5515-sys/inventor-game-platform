<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Spectrum Game Engine</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b1018;
      color: #eef4fb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box {
      max-width: 760px;
      margin: 0 auto;
      background: #131b29;
      border: 1px solid #26354d;
      border-radius: 16px;
      padding: 22px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 18px; color: #9fb1c9; font-size: 0.92rem; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2b3c57;
      background: #0b1018;
      color: #fff;
      font-size: 0.92rem;
      box-sizing: border-box;
    }
    textarea { min-height: 85px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
    .checks label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 600; }
    .checks input { width: auto; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .primary { background: #38bdf8; color: #06131c; }
    .success { background: #22c55e; color: #05180c; }
    pre {
      margin-top: 16px;
      background: #070b11;
      border: 1px solid #223047;
      border-radius: 12px;
      padding: 14px;
      color: #9ae6ff;
      font-size: 0.8rem;
      overflow: auto;
      max-height: 280px;
      direction: ltr;
      text-align: left;
    }
    .msg { margin-top: 10px; color: #86efac; font-size: 0.88rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Full-Spectrum Game Engine</h1>
    <p>اضبط مواصفات اللعبة وحمّل <code>world_spec.json</code> مباشرة — ارفعه إلى GitHub ليبدأ البناء تلقائياً بدون توكن.</p>

    <div class="row">
      <div>
        <label for="projectName">اسم المشروع</label>
        <input id="projectName" type="text" value="DarkLabContainment" />
      </div>
      <div>
        <label for="scenarioPreset">السيناريو</label>
        <select id="scenarioPreset">
          <option value="dark_lab" selected>dark_lab</option>
          <option value="subway_tunnels">subway_tunnels</option>
          <option value="abandoned_hospital">abandoned_hospital</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="screenCurve">عوجة الشاشة (0.00 - 0.35)</label>
        <input id="screenCurve" type="number" step="0.01" min="0" max="0.35" value="0.12" />
      </div>
      <div>
        <label for="zonesCount">عدد المناطق (1 - 6)</label>
        <input id="zonesCount" type="number" min="1" max="6" value="3" />
      </div>
    </div>

    <label for="gamePrompt">وصف المرحلة أو اللعبة</label>
    <textarea id="gamePrompt">لعبة رعب وبقاء في مختبر مظلم وضبابي مع بطاريات وبطاقات وصول ومطاردة وتحكم متكامل.</textarea>

    <div class="checks">
      <label><input id="platWin" type="checkbox" checked /> Windows</label>
      <label><input id="platLinux" type="checkbox" checked /> Linux</label>
      <label><input id="platAndroid" type="checkbox" checked /> Android APK</label>
    </div>

    <div class="btns">
      <button class="primary" id="btnGenerate">توليد وتحميل world_spec.json</button>
      <button class="success" id="btnCopy">نسخ JSON</button>
    </div>
    <div class="msg" id="msg"></div>
    <pre id="preview"></pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function makeSpec() {
      const scenario = $("scenarioPreset").value;
      const count = Math.max(1, Math.min(6, Number($("zonesCount").value) || 3));
      const curve = Math.max(0, Math.min(0.35, Number($("screenCurve").value) || 0.12));
      const platforms = [];
      if ($("platWin").checked) platforms.push("Windows");
      if ($("platLinux").checked) platforms.push("Linux");
      if ($("platAndroid").checked) platforms.push("Android");

      const zones = Array.from({ length: count }, (_, i) => ({
        id: `zone_${String(i + 1).padStart(2, "0")}_${scenario}`,
        type: i === 0 ? "entry_hall" : (i === count - 1 ? "containment_wing" : "research_corridor"),
        triggers: i === count - 1 ? [`keycard_${i + 1}`, "exit_gate"] : [`keycard_${i + 1}`]
      }));

      return {
        project_name: ($("projectName").value || "DarkLabContainment").trim(),
        scenario_preset: scenario,
        source_prompt: $("gamePrompt").value.trim(),
        target_platforms: platforms.length ? platforms : ["Windows", "Linux"],
        atmosphere: {
          screen_curve_strength: curve,
          fog_enabled: true,
          flicker_enabled: true
        },
        zones
      };
    }

    function updatePreview() {
      $("preview").textContent = JSON.stringify(makeSpec(), null, 2);
    }

    $("btnGenerate").addEventListener("click", () => {
      const text = JSON.stringify(makeSpec(), null, 2);
      $("preview").textContent = text;
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "world_spec.json";
      a.click();
      URL.revokeObjectURL(url);
      $("msg").textContent = "تم تحميل world_spec.json — ارفعه إلى المستودع ليبدأ البناء تلقائياً.";
    });

    $("btnCopy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("preview").textContent);
        $("msg").textContent = "تم نسخ JSON.";
      } catch {
        $("msg").textContent = "انسخ النص مباشرة من المربع بالأسفل.";
      }
    });

    ["projectName", "scenarioPreset", "screenCurve", "zonesCount", "gamePrompt", "platWin", "platLinux", "platAndroid"]
      .forEach((id) => $(id).addEventListener("input", updatePreview));

    updatePreview();
  </script>
</body>
</html>
